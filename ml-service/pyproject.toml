[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-service"
version = "1.0.0"
description = "Servicio ML de XMR-Forecast (LSTM/GRU vs. baselines). No es asesoria financiera."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "scikit-learn==1.9.1",
  "statsmodels==0.15.0",
  "joblib==1.6.0",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "mlflow-skinny==3.16.1",
]

[project.optional-dependencies]
# TensorFlow es OPCIONAL: los tests y CI sin TF deben pasar igual (R-17/R-13).
tf = ["tensorflow==2.20.0"]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.9",
  "mypy==2.3.1",
  "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "D",    # pydocstyle (google)
  "RUF",  # ruff-specific
]
ignore = [
  "D107",   # los parametros se documentan en el docstring de la clase
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
  "D401",   # imperative mood not enforced
  "D105",   # los metodos magicos se documentan en la clase
  "RUF012", # mutable class attrs are fine here
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# FastAPI exige declarar las dependencias en los argumentos por defecto.
"app/api/*" = ["B008"]
"tests/*" = ["D", "ANN", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
# El intérprete real es 3.12 (spec 3.11); los stubs de numpy usan sintaxis 3.12.
python_version = "3.12"
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ['^\.venv[\\/]']

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "statsmodels.*", "sklearn.*", "yaml.*", "mlflow.*", "joblib.*", "keras.*"]
ignore_missing_imports = true