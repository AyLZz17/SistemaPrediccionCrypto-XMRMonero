# =====================================================================
# XMR-Forecast :: override de DESARROLLO
#
# POR QUE EXISTE
#   En `docker-compose.yml` PostgreSQL y Redis viven en la red `data`, marcada
#   `internal: true`, y sin puertos publicados. Eso es lo correcto y es lo que
#   exige R-27: sin puerta de enlace, nada alcanza el contenedor desde la red.
#   Pero impide levantar el backend fuera de Docker (`mvn spring-boot:run`,
#   IntelliJ) o inspeccionar la base con psql desde el host.
#
# QUE HACE ESTE OVERRIDE
#   1. Publica PostgreSQL y Redis **solo en loopback** (127.0.0.1). No es
#      alcanzable desde la red, asi que R-27 se sigue cumpliendo.
#   2. Conecta ademas esos dos servicios a la red `backend`, que no es interna.
#      Sin esto el binding no funciona: una red `internal: true` no tiene ruta de
#      vuelta al host, de modo que Docker acepta el puerto y no publica nada.
#      `docker port <contenedor>` sale vacio y el cliente se acaba conectando a
#      OTRO PostgreSQL del host (si lo hay), con el sintomas desconcertante de un
#      "password authentication failed" que no tiene nada que ver con la
#      configuracion de este sistema.
#
# PUERTOS 55432 / 56379, no 5432 / 6379
#   5432 y 6379 estan ocupados con frecuencia por instalaciones locales, y el
#   conflicto tampoco avisa con claridad. DB_URL correspondiente:
#     jdbc:postgresql://127.0.0.1:55432/xmr_forecast
#
# USO
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# EN PRODUCCION
#   No uses este fichero. Solo el `docker-compose.yml` base.
# =====================================================================

services:

  postgres:
    ports:
      - "127.0.0.1:55432:5432"
    networks:
      - data
      - backend

  redis:
    ports:
      - "127.0.0.1:56379:6379"
    networks:
      - data
      - backend

  # MLflow ya estaba en loopback en el Compose base; se repite para que quien
  # lea este fichero vea la intencion sin consultar el fichero base.
  mlflow:
    ports:
      - "127.0.0.1:5000:5000"
