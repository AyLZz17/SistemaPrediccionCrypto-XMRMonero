# =====================================================================
# XMR-Forecast :: Blueprint de Render (solo computo; datos ya creados a mano)
#
# USO
#   Render → New → Blueprint → repo → Apply. Los valores `sync: false` se
#   rellenan en el dashboard (vienen de las paginas de Postgres/Key Value del
#   paso 1). Los ficheros `docker/certs` NO estan en git (ignorado): se suben
#   como Secret Files en el dashboard con las rutas exactas de abajo.
#
# TOPOLOGIA
#   internet (TLS del borde) → xmr-backend (HTTP interno, SERVER_SSL_ENABLED)
#   xmr-backend → ml-service (HTTPS con CA propia, nombre `ml-service` = SAN)
#   MLflow no se despliega: tracking en modo degradado (ML_MLFLOW_ENABLED).
# =====================================================================

services:
  # ------------------------------------------------------- backend (publico)
  - type: web
    name: xmr-backend
    runtime: docker
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_SSL_ENABLED
        value: "false"
      - key: SERVER_PORT
        value: "10000"
      - key: DB_URL
        sync: false # jdbc:postgresql://<host-interno>:5432/<db> (pagina Postgres)
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false # hostname interno del Key Value (sin puerto ni esquema)
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "false"
      - key: JWT_SECRET
        sync: false # generar: openssl rand -base64 64
      - key: JWT_ISSUER
        # Sufijo `-bcml` asignado por Render al recrear el servicio. Debe ser el
        # host real: con un host que no existe vuelve a romper el login con Google.
        value: https://xmr-backend-bcml.onrender.com
      - key: JWT_AUDIENCE
        value: xmr-forecast-api
      - key: ML_SERVICE_URL
        # Sufijo `-adbd` asignado por Render. Verificado: /health responde 200 y
        # /v1/models responde 401 sin el secreto, como exige R-32.
        value: https://ml-service-adbd.onrender.com
      - key: ML_INTERNAL_TOKEN
        sync: false # MISMO valor que en ml-service
      - key: CORS_ALLOWED_ORIGINS
        value: https://sistema-prediccion-crypto-xmr-moner.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        # Debe coincidir EXACTAMENTE con el URI registrado en Google Cloud
        # (cliente web 1038592254376-...). Verificado en produccion: es el valor
        # que devuelve el 307 de /authorize y el que Google acepta.
        value: https://xmr-backend-bcml.onrender.com/api/v1/auth/google/callback
      - key: FRONTEND_OAUTH_CALLBACK
        value: https://sistema-prediccion-crypto-xmr-moner.vercel.app/auth/callback
      # Render Free bloquea el trafico saliente a los puertos SMTP 25, 465 y 587
      # (vigente desde el 26/09/2025): `smtp.gmail.com:587` responde Connection
      # timed out. Por eso en produccion el correo sale por la Gmail API, que usa
      # HTTPS y firma el mensaje el propio Google.
      - key: MAIL_TRANSPORT
        value: "gmail"
      - key: GOOGLE_MAIL_REFRESH_TOKEN
        sync: false # caduca a los 7 dias si el consentimiento esta en Testing
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_FROM
        sync: false
      # Nombre visible del remitente (no es secreto).
      - key: MAIL_FROM_NAME
        value: XMR-Forecast
      - key: FRONTEND_BASE_URL
        value: https://sistema-prediccion-crypto-xmr-moner.vercel.app
      # El backend valida al ML con la CA publica del borde: no necesita
      # truststore casero (TRUSTSTORE_B64 solo para topologias con CA propia).
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75"

  # -------------------------------------------------- ml-service (publico con secreto)
  # El plan trial no admite servicios privados: se expone tras el borde TLS de
  # Render con HTTP interno + secreto compartido (X-Internal-Token). Sin el
  # secreto, todo salvo /health responde 401. Ver R-32.
  - type: web
    name: ml-service
    runtime: docker
    branch: main
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ML_ENVIRONMENT
        value: prod
      - key: ML_BEHIND_TLS_EDGE
        value: "true"
      - key: ML_INTERNAL_TOKEN
        sync: false # MISMO valor que en xmr-backend (generar: 32 bytes hex)
      - key: ML_MLFLOW_ENABLED
        value: "false"
      - key: ML_ALLOW_PLAINTEXT_DEV
        value: "false"
