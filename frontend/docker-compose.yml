# ---------------------------------------------------------------------------
# XMR-Forecast frontend — desarrollo local.
#
# Este compose SOLO levanta el frontend. El backend Spring Boot (monolito,
# Java 21) se ejecuta fuera de aqui: el frontend nunca habla con PostgreSQL,
# Redis, MLflow ni con el servicio ML (R-32); solo consume /api/v1 del backend.
#
# Las variables VITE_* se inyectan en tiempo de construccion, no en runtime.
# ---------------------------------------------------------------------------

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Debe ser https:// ; el validador aborta el arranque en caso contrario.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://localhost:8443}
        VITE_REFRESH_TOKEN_MODE: ${VITE_REFRESH_TOKEN_MODE:-cookie}
        VITE_REQUEST_TIMEOUT_MS: ${VITE_REQUEST_TIMEOUT_MS:-20000}
    ports:
      - "8080:8080"
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Red publica: el contenedor solo se expone por el puerto 8080. La red
    # privada de PostgreSQL / Redis / MLflow es responsabilidad del despliegue
    # del backend (R-27).
    networks:
      - edge

networks:
  edge:
    driver: bridge
