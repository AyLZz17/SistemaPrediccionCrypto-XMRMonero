# ---------------------------------------------------------------------------
# XMR-Forecast frontend — configuracion de nginx.
#
# R-33  HTTPS forzado: 80 -> 301 a https, HSTS, TLS moderno.
# R-35  Cabeceras de seguridad en todas las respuestas y proxy de /api/ al
#       backend Spring Boot con X-Forwarded-Proto https y reenvio del
#       requestId de correlacion.
# R-11/R-12  El bundle no es asesoria financiera; la UI lo muestra de forma
#       visible, no aqui.
#
# Certificados: monta /etc/nginx/tls/fullchain.pem y /etc/nginx/tls/privkey.pem
# (nunca versionados, ver .gitignore). Si el TLS termina en un load balancer,
# comenta el bloque `server` que escucha en 443 y deja solo el 8080 interno.
# ---------------------------------------------------------------------------

# El nombre del upstream es `backend` a proposito: nginx lo usa como SNI
# (`proxy_ssl_server_name`) y como nombre verificado (`proxy_ssl_name`), y el
# certificado del backend solo trae SAN `backend` (no `xmr_backend`). Con otro
# nombre, Tomcat aborta el handshake con `illegal_parameter`.
upstream backend {
    server backend:8443;
    keepalive 16;
}

# Cabeceras de seguridad aplicadas a TODAS las respuestas.
map $sent_http_content_type $xmr_default_type {
    default                     "application/octet-stream";
    text/html                   "text/html; charset=utf-8";
    text/css                    "text/css; charset=utf-8";
    application/javascript      "application/javascript; charset=utf-8";
    application/json            "application/json; charset=utf-8";
}

server {
    listen      8080;
    listen      [::]:8080;
    # TLS local (R-33): el puerto publicado es el 8443. El 8080 queda solo
    # para la sonda interna /healthz, sin publicar al host.
    listen      8443 ssl;
    listen      [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/frontend/cert.pem;
    ssl_certificate_key /etc/nginx/tls/frontend/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Solo sirve la SPA; el TLS lo termina el proxy externo en este despliegue.
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options    "nosniff"                  always;
    add_header X-Frame-Options           "DENY"                     always;
    add_header Referrer-Policy           "no-referrer"              always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"             always;
    add_header Cross-Origin-Resource-Policy "same-origin"           always;
    add_header X-XSS-Protection          "0"                        always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # El bundle solo habla con su propio origen y con destinos https.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; upgrade-insecure-requests" always;

    server_tokens off;
    client_max_body_size 2m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # HTTP en claro contra el puerto TLS (codigo interno 497 de nginx):
    # redirigir a HTTPS preservando host y ruta, en vez del 400 en crudo.
    error_page 497 https://$http_host$request_uri;

    # Fallos del backend o del proxy (500/502/503/504): pagina propia con la
    # identidad del producto, en vez del 502 en blanco de nginx.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        access_log off;
        root /usr/share/nginx/html;
        internal;
    }

    # Sonda de vida para el HEALTHCHECK del contenedor.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------ API proxy
    # Unico punto de salida hacia el backend. El frontend no conoce la
    # topologia interna (nunca ve PostgreSQL, Redis, MLflow ni el servicio ML).
    location /api/ {
        proxy_pass         https://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # Correlacion frontend -> backend -> ML (R-26/R-32).
        proxy_set_header X-Request-Id      $http_x_request_id;
        proxy_pass_request_headers        on;

        # Cookies httpOnly de refresco: solo al backend, nunca al cliente final.
        proxy_cookie_domain  ~.*$  $host;
        proxy_cookie_path     /api/v1/auth  /api/v1/auth;

        proxy_ssl_server_name on;
        proxy_ssl_protocols   TLSv1.2 TLSv1.3;
        proxy_ssl_verify      on;
        proxy_ssl_trusted_certificate /etc/nginx/tls/ca/ca.crt;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # El backend nunca debe cachear respuestas autenticadas.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # --------------------------------------------------------- SPA fallback
    # index.html nunca se cachea: es el manifiesto de los bundles versionados.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sin acceso a ficheros ocultos ni a metadatos del repositorio.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

