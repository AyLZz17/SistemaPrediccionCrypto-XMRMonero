# =====================================================================
# XMR-Forecast backend :: configuracion
# TODOS los secretos vienen del entorno (R-14). Este archivo no contiene
# ninguna credencial. HTTPS es obligatorio tambien en desarrollo (R-33).
# =====================================================================
spring:
  application:
    name: xmr-forecast-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xmr_forecast}
    username: ${DB_USERNAME:xmr}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es la unica fuente de verdad del esquema (R-34): validate, nunca update/create
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 3s
      repositories:
        enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - email
              - profile
            redirect-uri: ${GOOGLE_REDIRECT_URI:https://localhost:8443/api/v1/auth/google/callback}

  cache:
    type: redis
    redis:
      time-to-live: 300s
      cache-null-values: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
    hibernate:
      mail:
        host: ${MAIL_HOST:localhost}
        port: ${MAIL_PORT:1025}

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${SERVER_SSL_KEYSTORE:file:/certs/backend/keystore.p12}
    key-store-password: ${SERVER_SSL_KEYSTORE_PASSWORD:}
    key-store-type: ${SERVER_SSL_KEYSTORE_TYPE:PKCS12}
    key-alias: ${SERVER_SSL_KEY_ALIAS:xmrforecast}
  # HTTP plano se rechaza: el TLS lo termina el proxy/ingress de la red privada.
  http:
    enabled: false
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: xmr-forecast-backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

info:
  app:
    name: XMR-Forecast
    version: 1.0.0
    disclaimer: >-
      Analisis predictivo de series de tiempo para Monero (XMR).
      No es asesoria financiera, no promete rentabilidad y no simula
      operaciones de trading.

# ---------------------------------------------------------------- app.*
app:
  jwt:
    # Sin valor por defecto: si falta, la aplicacion NO arranca (R-14).
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:https://localhost:8443}
    audience: ${JWT_AUDIENCE:xmr-forecast-api}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:2592000}
    clock-skew-seconds: 30

  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:https://localhost:8443/api/v1/auth/google/callback}
      frontend-callback: ${FRONTEND_OAUTH_CALLBACK:https://localhost:3000/auth/callback}
      # Solo HTTPS, y solo los emisores de Google (OWASP)
      allowed-issuers:
        - https://accounts.google.com
        - https://accounts.google.co.uk
      expected-audience: ${GOOGLE_CLIENT_ID:}

  ml:
    base-url: ${ML_SERVICE_URL:https://ml-service:8443}
    connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${ML_READ_TIMEOUT_MS:60000}
    max-retries: ${ML_MAX_RETRIES:2}
    verify-tls: ${ML_VERIFY_TLS:true}

  security:
    # Falla el arranque si se sirve por HTTP plano
    require-https: true
    hsts-max-age-seconds: 31536000
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:3000}
    rate-limit:
      enabled: true
      login-attempts-per-minute: ${RATE_LIMIT_LOGIN:5}
      api-requests-per-minute: ${RATE_LIMIT_API:300}
    account:
      max-failed-logins: ${MAX_FAILED_LOGINS:5}
      lock-duration-minutes: ${LOCK_DURATION_MINUTES:15}

  jobs:
    max-attempts: 3
    heartbeat-timeout-seconds: 900